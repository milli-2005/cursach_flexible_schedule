# 4 шаг — конфиг Nginx внутри Docker
server {
    # Слушаем 80 порт внутри контейнера 
    listen 80;
    # Принимаем запросы на любые доменные имена (заглушка)
    server_name _;

    # Максимальный размер тела запроса (для загрузки файлов/аватарок)
    client_max_body_size 20m;
    # Отладочный заголовок — видно в DevTools, что запрос прошёл через Nginx
    add_header X-Proxy-By "Nginx Frontend" always;

    # Статические файлы Django (CSS, JS, картинки) — Nginx отдаёт сам, не трогая Django
    location /static/ {
        alias /app/staticfiles/;      # откуда брать файлы (static_data volume)
        expires 7d;                    # кэшировать у клиента на 7 дней
        add_header Cache-Control "public, max-age=604800";
    }

    # Пользовательские файлы (аватарки, загрузки) — Nginx отдаёт сам
    location /media/ {
        alias /app/media/;            # media_data volume, общий с backend
        expires 1d;                    # кэшировать на 1 день (файлы меняются чаще)
        add_header Cache-Control "public, max-age=86400";
    }

    # Всё остальное (страницы, API, админка) — прокси на Django
    location / {
        proxy_pass http://backend:8000;  # отправляем запрос в контейнер backend (Django)
        proxy_http_version 1.1;
        proxy_set_header Host $host;               # передаём оригинальный Host
        proxy_set_header X-Real-IP $remote_addr;    # реальный IP клиента
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # цепочка IP
        proxy_set_header X-Forwarded-Proto $scheme; # http или https
    }
}
